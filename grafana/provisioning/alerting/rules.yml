apiVersion: 1

groups:
  - orgId: 1
    name: application-support
    folder: Application Support
    interval: 10s
    rules:
      - uid: lab-api-down
        title: API Down
        condition: B
        for: 30s
        noDataState: NoData
        execErrState: Error
        dashboardUid: application-support-monitoring-lab
        panelId: 1
        labels:
          severity: critical
          environment: lab
        annotations:
          summary: A recolha de métricas da API falhou durante 30 segundos.
          description: up=0 indica falha no scrape; confirma a API, a rede e os logs.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: up{job="api"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
      - uid: lab-high-http-500
        title: High HTTP 500 Error Rate
        condition: B
        for: 1m
        noDataState: NoData
        execErrState: Error
        dashboardUid: application-support-monitoring-lab
        panelId: 3
        labels:
          severity: warning
          environment: lab
        annotations:
          summary: Mais de 5% de erros HTTP 500 durante 1 minuto.
          description: Janela de 5 minutos, mínimo estimado de 100 pedidos e API com scrape UP.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: >-
                (
                  100 * (sum(rate(demo_http_requests_total{job="api",status="500"}[5m])) or vector(0))
                  / clamp_min((sum(rate(demo_http_requests_total{job="api"}[5m])) or vector(0)), 1e-9)
                )
                * ((sum(increase(demo_http_requests_total{job="api"}[5m])) or vector(0)) >= bool 100)
                * (min(up{job="api"}) == bool 1)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [5]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
